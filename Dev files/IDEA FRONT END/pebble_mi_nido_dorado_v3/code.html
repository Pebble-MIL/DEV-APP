<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pebble - Mi Nido Dorado</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Bricolage+Grotesque:wght@800&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .spring-bounce {
            animation: spring-bounce 2s infinite ease-in-out;
        }

        @keyframes spring-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        .pebble-shadow {
            box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.1);
        }
        
        .pebble-active:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1);
        }

        .island-path {
            background-image: radial-gradient(circle, #bfc8d0 2px, transparent 2px);
            background-size: 24px 24px;
        }

        /* Tactile Button Shadows */
        .btn-shadow-primary { box-shadow: 0 4px 0 0 #004c6b; }
        .btn-shadow-primary:active { transform: translateY(4px); box-shadow: 0 0 0 0 #004c6b; }
        
        .btn-shadow-secondary { box-shadow: 0 4px 0 0 #bfc8d0; }
        .btn-shadow-secondary:active { transform: translateY(4px); box-shadow: 0 0 0 0 #bfc8d0; }
    </style>

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">

<div class="flex justify-between items-center w-full px-5 py-4 max-w-7xl mx-auto">
<div class="text-headline-md-mobile font-headline-md font-black text-primary tracking-tighter hover:scale-105 transition-transform active:translate-y-1">
                Pebble
            </div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 hover:scale-105 active:translate-y-1 transition-all">toll</button>
<div class="w-10 h-10 rounded-full border-2 border-primary overflow-hidden hover:scale-105 transition-transform">
<img class="w-full h-full object-cover" data-alt="A profile avatar of a young student with a friendly smile, wearing modern glasses and a colorful hoodie. The illustration is clean, using a vector-style flat design with soft gradients that match the ice-blue and primary-blue color palette of the Pebble app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVQQkvEpJpUF0WgObMTaZd3bRETztgkTY--h07VyfwXBeOO5WtmGa0ppheanT_lfbEHQp3xtpVdN4Si7TdK4MrsED4VBNytj4qJ8nF6KGeRwHQ5bjlBE1G_OCgR8RylzQ4BUIcxP1TlAfvKrqxjY_gdCUlvJsC-x6AKWoCLo2WZWy7kdGHtjVDiFSm_rDA_1q2zLefXyd-RP4OSczmBs-SY-hO5H13T_dWJ0U_kpZaiFGGXMpfrUk3Pl0U-gOJr4EAad7hdwRRqF8"/>
</div>
</div>
</div>
</header>
<!-- Stats Bar -->
<div class="bg-surface-container-low px-5 py-3 border-b-2 border-surface-variant">
<div class="max-w-7xl mx-auto flex justify-around items-center">
<div class="flex flex-col items-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest text-[10px]">Stones</span>
<span class="font-label-mono text-headline-md text-primary">1,280</span>
</div>
<div class="h-8 w-px bg-outline-variant"></div>
<div class="flex flex-col items-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest text-[10px]">Level</span>
<span class="font-label-mono text-headline-md text-tertiary">14</span>
</div>
<div class="h-8 w-px bg-outline-variant"></div>
<div class="flex flex-col items-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest text-[10px]">Progress</span>
<span class="font-label-mono text-headline-md text-secondary">82%</span>
</div>
</div>
</div>
<!-- Main Canvas -->
<main class="flex-grow max-w-7xl mx-auto w-full p-5 pb-32">
<!-- Nest Area with Spring Animation -->
<section class="mb-10 text-center">
<div class="relative inline-block py-8 px-12 bg-surface-container-high rounded-[40px] border-2 border-outline-variant spring-bounce">
<div class="absolute -top-4 -left-4 bg-tertiary-fixed text-on-tertiary-fixed font-headline-md px-4 py-1 rounded-full border-2 border-tertiary shadow-sm transform -rotate-12">
                    Mi Nido
                </div>
<!-- Interactive Pebble Grid -->
<div class="grid grid-cols-4 gap-4">
<!-- Coral Pebbles (Social/Creative) -->
<div class="w-12 h-12 rounded-full bg-secondary-container pebble-shadow pebble-active border-b-4 border-secondary transition-all cursor-pointer flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]">favorite</span>
</div>
<div class="w-12 h-12 rounded-full bg-secondary-container pebble-shadow pebble-active border-b-4 border-secondary transition-all cursor-pointer"></div>
<!-- Amber Pebbles (Cognitive/Focus) -->
<div class="w-12 h-12 rounded-full bg-tertiary-fixed-dim pebble-shadow pebble-active border-b-4 border-tertiary transition-all cursor-pointer flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined text-[20px]">lightbulb</span>
</div>
<div class="w-12 h-12 rounded-full bg-tertiary-fixed-dim pebble-shadow pebble-active border-b-4 border-tertiary transition-all cursor-pointer"></div>
<!-- Seafoam Pebbles (Wellness/Habit) -->
<div class="w-12 h-12 rounded-full bg-[#9ee8cc] pebble-shadow pebble-active border-b-4 border-[#32a87d] transition-all cursor-pointer flex items-center justify-center text-[#004d33]">
<span class="material-symbols-outlined text-[20px]">spa</span>
</div>
<div class="w-12 h-12 rounded-full bg-[#9ee8cc] pebble-shadow pebble-active border-b-4 border-[#32a87d] transition-all cursor-pointer"></div>
<div class="w-12 h-12 rounded-full bg-[#9ee8cc] pebble-shadow pebble-active border-b-4 border-[#32a87d] transition-all cursor-pointer"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container pebble-shadow pebble-active border-b-4 border-secondary transition-all cursor-pointer"></div>
</div>
</div>
<p class="mt-6 font-headline-md text-on-surface-variant">Has recolectado <span class="text-primary">8</span> piedritas hoy.</p>
</section>
<!-- Map Path Progress -->
<section class="island-path p-8 rounded-xl border-2 border-outline-variant bg-surface overflow-hidden relative">
<h3 class="font-headline-md text-on-surface mb-8">Ruta del Aventurero</h3>
<div class="relative flex flex-col items-center gap-12">
<!-- Island Step 1 (Completed) -->
<div class="flex items-center gap-4 w-full">
<div class="w-16 h-16 rounded-2xl bg-primary-container border-b-4 border-on-primary-fixed-variant flex items-center justify-center text-on-primary-container pebble-active cursor-pointer">
<span class="material-symbols-outlined text-3xl">check</span>
</div>
<div>
<h4 class="font-bold text-on-surface">Bahía Calma</h4>
<p class="text-sm text-on-surface-variant">Completado</p>
</div>
</div>
<!-- Connecting Line (SVG for precision) -->
<div class="absolute top-16 w-1 h-12 bg-primary-container left-7.5"></div>
<!-- Island Step 2 (Active) -->
<div class="flex items-center gap-4 w-full pl-8">
<div class="w-20 h-20 rounded-full bg-primary ring-4 ring-primary-fixed-dim border-b-4 border-on-primary-fixed-variant flex items-center justify-center text-white pebble-active cursor-pointer shadow-lg">
<span class="material-symbols-outlined text-4xl">flag</span>
</div>
<div>
<h4 class="font-bold text-primary font-headline-md">Bosque Dorado</h4>
<p class="text-sm text-on-surface-variant">En progreso</p>
</div>
</div>
<!-- Connecting Line Locked -->
<div class="absolute top-44 w-1 h-12 bg-outline-variant left-15.5"></div>
<!-- Island Step 3 (Locked) -->
<div class="flex items-center gap-4 w-full pl-16">
<div class="w-16 h-16 rounded-2xl bg-surface-dim border-b-4 border-outline flex items-center justify-center text-outline-variant cursor-not-allowed">
<span class="material-symbols-outlined text-3xl">lock</span>
</div>
<div>
<h4 class="font-bold text-outline">Cima del Viento</h4>
<p class="text-sm text-outline-variant">Bloqueado</p>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface border-t-4 border-surface-variant flex justify-around items-center px-4 pb-8 pt-4 shadow-[0_-4px_0_0_rgba(0,0,0,0.05)]">
<!-- Nest (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-lg border-b-4 border-on-primary-fixed-variant p-3 transform -translate-y-1 transition-all" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-label-lg font-label-lg mt-1">Nest</span>
</a>
<!-- Adventure -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all active:translate-y-1" href="#">
<span class="material-symbols-outlined">sports_esports</span>
<span class="text-label-lg font-label-lg mt-1">Adventure</span>
</a>
<!-- Map -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all active:translate-y-1" href="#">
<span class="material-symbols-outlined">map</span>
<span class="text-label-lg font-label-lg mt-1">Map</span>
</a>
</nav>
<!-- Floating Action Button (Primary Action) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-full max-w-md px-6 z-40">
<button class="w-full bg-primary text-white py-4 px-6 rounded-2xl font-headline-md flex items-center justify-center gap-2 btn-shadow-primary transition-all active:translate-y-1 active:shadow-none">
<span class="material-symbols-outlined">rocket_launch</span>
            ¡Explorar Ahora!
        </button>
</div>
<script>
        // Simple Interaction Logic
        document.querySelectorAll('.pebble-active').forEach(pebble => {
            pebble.addEventListener('click', () => {
                // Add a small bounce scale effect on click
                pebble.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    pebble.style.transform = 'scale(1)';
                }, 100);
            });
        });

        // Dynamic Progress Update simulation
        let currentProgress = 82;
        const progressEl = document.querySelector('.text-secondary');
        setInterval(() => {
            if(Math.random() > 0.8) {
                currentProgress = Math.min(100, currentProgress + 1);
                progressEl.textContent = `${currentProgress}%`;
            }
        }, 5000);
    </script>
</body></html>
